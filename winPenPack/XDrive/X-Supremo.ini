; ============================================================
;  X-Supremo-Default.ini
;  winPenPack X-Launcher - Supremo Remote Control
;
;  TEMPLATE — non modificare direttamente.
;  Viene copiato e personalizzato da INIZIALIZZA.bat
;  per ogni profilo creato. Il testo ##NOMEPROFILO##
;  viene sostituito con il nome scelto dall'utente.
;
;  Struttura WinPenPack risultante sulla chiavetta:
;
;  <unita>:\WinPenPack\
;  ├── XDrive\
;  │   ├── X-Supremo-Default.exe   ← X-Launcher.exe rinominato
;  │   ├── X-Supremo-Default.ini   ← questo template
;  │   ├── X-Supremo-##NOMEPROFILO##.exe   ← generato da INIZIALIZZA
;  │   └── X-Supremo-##NOMEPROFILO##.ini   ← generato da INIZIALIZZA
;  ├── Bin\Supremo\
;  │   ├── Supremo.exe
;  │   └── INIZIALIZZA.bat
;  ├── User\Supremo\
;  │   └── ##NOMEPROFILO##\
;  │       └── settings.dat        ← profilo attivo
;  └── Backup\Supremo\
;      └── ##NOMEPROFILO##\
;          ├── settings.bak1       ← più recente
;          ├── settings.bak2
;          ├── settings.bak3
;          ├── settings.bak4
;          └── settings.bak5       ← più vecchio
;
; $ScriptDir$ = XDrive\  →  ..\  = WinPenPack\
; ============================================================

[Launch]
ProgramName=Supremo - ##NOMEPROFILO##
ProgramExecutable=..\Bin\Supremo\Supremo.exe
ProgramExecutableParameters=
RunWait=true
MultipleInstances=false

; ============================================================
;  RUNBEFORE
;  1. Copia script helper in %TEMP% ed eseguilo:
;     - salva settings.dat del PC in %TEMP% se esiste
;       (caso limite: se non esiste non fa nulla)
;  2. Backup a rotazione profilo chiavetta (5 copie)
;  3. Copia profilo portatile chiavetta → PC
; ============================================================
[RunBefore]

; -- Copia helper pre-sessione in %TEMP% ed eseguilo (invisibile) --
FileCopy1=$ScriptDir$\..\Bin\Supremo\xsupremo_before.vbs|%TEMP%\xsupremo_before.vbs|o
Execute1=wscript.exe "%TEMP%\xsupremo_before.vbs"|wait

; -- Rotazione backup chiavetta: scala di una posizione --
FileCopy2=$ScriptDir$\..\Backup\Supremo\##NOMEPROFILO##\settings.bak4|$ScriptDir$\..\Backup\Supremo\##NOMEPROFILO##\settings.bak5|o
FileCopy3=$ScriptDir$\..\Backup\Supremo\##NOMEPROFILO##\settings.bak3|$ScriptDir$\..\Backup\Supremo\##NOMEPROFILO##\settings.bak4|o
FileCopy4=$ScriptDir$\..\Backup\Supremo\##NOMEPROFILO##\settings.bak2|$ScriptDir$\..\Backup\Supremo\##NOMEPROFILO##\settings.bak3|o
FileCopy5=$ScriptDir$\..\Backup\Supremo\##NOMEPROFILO##\settings.bak1|$ScriptDir$\..\Backup\Supremo\##NOMEPROFILO##\settings.bak2|o
FileCopy6=$ScriptDir$\..\User\Supremo\##NOMEPROFILO##\settings.dat|$ScriptDir$\..\Backup\Supremo\##NOMEPROFILO##\settings.bak1|o

; -- Copia profilo portatile sul PC --
FileCopy7=$ScriptDir$\..\User\Supremo\##NOMEPROFILO##\settings.dat|C:\ProgramData\SupremoRemoteDesktop\settings.dat|o

; ============================================================
;  RUNAFTER
;  1. Salva profilo aggiornato sulla chiavetta
;  2. Elimina settings.dat portatile dal PC
;  3. Copia script helper in %TEMP% ed eseguilo:
;     - ripristina settings.dat originale se era stato salvato
;     - se non era stato salvato lascia il PC pulito
; ============================================================
[RunAfter]

; -- Salva profilo aggiornato sulla chiavetta --
FileCopy1=C:\ProgramData\SupremoRemoteDesktop\settings.dat|$ScriptDir$\..\User\Supremo\##NOMEPROFILO##\settings.dat|o

; -- Elimina profilo portatile dal PC --
FileDelete1=C:\ProgramData\SupremoRemoteDesktop\settings.dat

; -- Copia helper post-sessione in %TEMP% ed eseguilo (invisibile) --
FileCopy2=$ScriptDir$\..\Bin\Supremo\xsupremo_after.vbs|%TEMP%\xsupremo_after.vbs|o
Execute2=wscript.exe "%TEMP%\xsupremo_after.vbs"|wait
